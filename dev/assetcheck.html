<!DOCTYPE html><html><head><meta charset="utf-8"><title>asset check</title>
<style>body{font:13px monospace;background:#111;color:#ddd}b{color:#7f7}i{color:#f77}</style></head><body><pre id="o"></pre>
<script>
const ids = (new URLSearchParams(location.search).get('ids')||'').split(',').filter(Boolean);
const urls = (new URLSearchParams(location.search).get('urls')||'').split('|').filter(Boolean);
const o = document.getElementById('o'); const log = (s) => { o.textContent += s + '\n'; };
const ac = new (window.AudioContext||window.webkitAudioContext)();
(async () => {
  for (const id of ids) {
    try {
      const m = await (await fetch('https://archive.org/metadata/' + id)).json();
      const fs = (m.files||[]).filter(f => /mp3|ogg|wav|flac/i.test(f.format||f.name));
      log('# ' + id + ' | ' + (m.metadata && m.metadata.title) + ' | lic ' + (m.metadata && m.metadata.licenseurl));
      for (const f of fs) log('   ' + f.name + ' | ' + f.format + ' | ' + f.length + 's | ' + f.size);
      const pick = fs.find(f => /VBR MP3|^MP3|128Kbps MP3/i.test(f.format)) || fs[0];
      if (pick) {
        const u = 'https://archive.org/download/' + id + '/' + encodeURIComponent(pick.name);
        try { const r = await fetch(u, { headers: { Range: 'bytes=0-400000' } }); const b = await r.arrayBuffer(); log('   CORS OK ' + r.status + ' ' + b.byteLength + ' bytes'); } catch (e) { log('   CORS FAIL ' + e); }
      }
    } catch (e) { log('# ' + id + ' ERR ' + e); }
  }
  for (const u of urls) {
    try { const r = await fetch(u); const b = await r.arrayBuffer(); log('URL OK ' + r.status + ' ' + b.byteLength + ' ' + u); } catch (e) { log('URL FAIL ' + u + ' ' + e); }
  }
  log('DONE');
})();
</script></body></html>
